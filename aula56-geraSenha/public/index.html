<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Modelo</title>
</head>

<body>

  <section class="container">
    <h1>Gerador de Senhas</h1>

    <div class="senha-gerada">Aguardando Gerar Senha!</div>

     Quantidade Caracteres<input type="number" min="1" max="50" class="qtd-caracteres">
     Adicionar Maiúsculas <input type="checkbox" class="chk-maiusculas" >
     Adicionar Minusculas <input type="checkbox" class="chk-minusculas" >
     Adicionar Numeros <input type="checkbox" class="chk-numeros" >
     Adicionar Simbolos <input type="checkbox" class="chk-simbolos" >
     <button class="gerar-senha">Gerar Senha</button>
  </section>

  <script src="./assets/js/bundle.js"></script>
</body>

</html>
