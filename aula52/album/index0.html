<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosso Álbum 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fef6f9;
      color: #333;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 1rem;
      background: linear-gradient(135deg, #ffd6e0, #ffe3f0);
      transition: background 1s ease;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    header p {
      font-size: 1.2rem;
      color: #555;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      transform: scale(0.95);
      opacity: 0;
      animation: fadeInZoom 0.8s ease forwards;
    }

    .gallery img:nth-child(1) { animation-delay: 0.2s; }
    .gallery img:nth-child(2) { animation-delay: 0.4s; }
    .gallery img:nth-child(3) { animation-delay: 0.6s; }
    .gallery img:nth-child(4) { animation-delay: 0.8s; }
    .gallery img:nth-child(5) { animation-delay: 1s; }

    .gallery img:hover {
      transform: scale(1.03);
      transition: transform 0.3s ease;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      background-color: #fff0f5;
      font-size: 0.9rem;
      color: #777;
      transition: background-color 0.5s ease;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes fadeInZoom {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Nosso Álbum de Amor</h1>
    <p>Memórias que guardamos com carinho 💞</p>
  </header>

  <!-- <section class="gallery">
    <img src="img/ChatGPT Image 3 de abr. de 2025, 21_35_02.png" alt="Foto no espelho" />
    <img src="img/ChatGPT Image 3 de abr. de 2025, 22_53_14.png" alt="Foto na praia" />
    <img src="img/ChatGPT Image 3 de abr. de 2025, 23_48_40.png" alt="Abraço no pier" />
    <img src="img/Screenshot_1.png" alt="Beijo na bochecha" />
    <img src="img/Screenshot_2.png" alt="Selfie na loja" />
  </section> -->

  <section class="gallery" id="gallery"></section>

  
  

  <footer>
    Feito com ❤️ por nós
  </footer>

  <script>
    fetch('/api/images')
      .then(res => res.json())
      .then(images => {
        const gallery = document.getElementById('gallery');
        images.forEach((src, index) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = `Foto ${index + 1}`;
          img.style.animationDelay = `${0.2 + index * 0.2}s`;
          gallery.appendChild(img);
        });
      });
  </script>
</body>
</html>
